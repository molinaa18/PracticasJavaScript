<!DOCTYPE html>

<body>
<h1>Práctica 1</h1>
<p>Esta es la primera práctica de JavaScript.</p>
<p>Se va a calcular las superficies de un cuadrado y un triángulo.</p>
<p>Los resultados se mostrarán en la consola del navegador tal y como se indica en las instrucciones del ejercicio</p>

<script>
    const ladoCuadrado = 5;
    const superficieCuadrado = ladoCuadrado * ladoCuadrado;

    console.log(`La superficie del cuadrado es: ${superficieCuadrado}`);

    const baseTriangulo = 4;
    const alturaTriangulo = 6;

    const superficieTriangulo = (baseTriangulo * alturaTriangulo) / 2;

    console.log(`La superficie del triángulo es: ${superficieTriangulo}`);
</script>
</body>
