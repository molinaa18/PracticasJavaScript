<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
    <style>
        /* Se añade estilo para que se entienda que son clickables */
        circle {
            cursor: pointer;
        }
    </style>
</head>
<body>
<div id="graph"></div>
<script src="https://d3js.org/d3.v4.js"></script>

<script>
    // Definición de constantes originales
    const GRAPH_HEIGHT = 400;
    const GRAPH_WIDTH = 400;
    const MARGIN = 30;

    // 1. Constante para el rango máximo y 3. Constante para el radio de los círculos
    const MAX_RANGE = 100;
    const CIRCLE_RADIUS = 5;

    // 2. Borrar puntos anteriores y pintar los nuevos
    const DATA = [
        { x: 20, y: 30 },
        { x: 35, y: 10 },
        { x: 70, y: 38 },
        { x: 100, y: 100 }
    ];

    // Funciones escalares
    const xScale = d3.scaleLinear()
        // 1. Modificar el rango de la gráfica usando la constante
        .domain([0, MAX_RANGE])
        .range([0, GRAPH_WIDTH]);

    const yScale = d3.scaleLinear()
        // 1. Modificar el rango de la gráfica usando la constante
        .domain([0, MAX_RANGE])
        .range([GRAPH_HEIGHT, 0]);

    // Gráfica al elemento del dom
    let svg = d3.select("#graph")
        .append("svg")
        .attr("width", GRAPH_WIDTH + MARGIN * 2)
        .attr("height", GRAPH_HEIGHT + MARGIN * 2)
        .append("g")
        .attr("transform", `translate(${MARGIN}, ${MARGIN})`);

    // Líneas de los ejes
    svg.append('g')
        .attr("transform", `translate(0, ${GRAPH_HEIGHT})`)
        .call(d3.axisBottom(xScale));

    svg.append('g')
        .call(d3.axisLeft(yScale));

    // Se añade un punto por cada objeto del array de datos
    svg.selectAll("circle") // Cambiado "whatever" por "circle" por convención
        .data(DATA)
        .enter()
        .append("circle")
        .attr("cx", ({ x }) => xScale(x))
        .attr("cy", ({ y }) => yScale(y))
        // 3. Modificar el radio de los círculos usando la constante
        .attr("r", CIRCLE_RADIUS)
        // 4. Mostrar alerta al hacer click con la posición
        .on("click", function(d) {
            alert(`Posición seleccionada -> X: ${d.x}, Y: ${d.y}`);
        });
</script>
</body>
</html>
